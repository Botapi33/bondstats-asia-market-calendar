name: Update Asia Market Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate calendar
        run: node src/update.mjs

      - name: Validate calendar
        run: node src/validate.mjs

      - name: Commit updated data
        run: |
          git config user.name "bondstats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json
          if git diff --cached --quiet; then
            echo "No calendar changes."
            exit 0
          fi
          git commit -m "Update Asia market calendar"
          git push
